# Render Blueprint for SkillBridge Platform
services:
  # Backend API Web Service
  - type: web
    name: skillbridge-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: skillbridge-db
    plan: free
    databaseName: skillbridge
    user: skillbridge_user
